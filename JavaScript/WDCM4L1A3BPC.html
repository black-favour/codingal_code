<!--
1) Start the HTML document with `<!DOCTYPE html>`.

2) Open the `<html>` tag.

3) Inside the `<body>` tag:

4) Add a heading using `<h2>`:
   a) Text: "JavaScript Statements"

5) Add a paragraph `<p>` explaining what a JavaScript program is:
   a) Use `<b>` tags to bold:
      - "JavaScript program"
      - "statements"

6) Create an empty paragraph to display the final output:
   a) Use `<p id="demo"></p>`
   b) This is where the result message will appear.

7) Add a `<script>` tag to write JavaScript code.

8) Inside the `<script>` tag:
   a) Declare three variables `x`, `y`, and `z` in one line.
      - This is Statement 1.
   b) Assign the value `5` to `x`.
      - This is Statement 2.
   c) Assign the value `6` to `y`.
      - This is Statement 3.
   d) Add `x` and `y` and store the result in `z`.
      - This is Statement 4.

9) Display the output on the webpage:
   a) Use `document.getElementById("demo")` to select the paragraph.
   b) Set `.innerHTML` to show:
      "The value of z is " + z + "."

10) Close all tags properly:
    a) Close `</script>`, `</body>`, and `</html>`.
-->
      <!DOCTYPE html>
      <html>
      <body>
   
         <h2>JavaScript Statements</h2>
   
         <p>A <b>JavaScript program</b> is a set of one or more <b>statements</b>.</p>
   
         <p id="demo"></p>
   
         <script>
         var x, y, z; // Statement 1
         x = 5;       // Statement 2
         y = 6;       // Statement 3
         z = x + y;   // Statement 4
   
         document.getElementById("demo").innerHTML = "The value of z is " + z + ".";
         </script>
   
      </body>
      </html>
