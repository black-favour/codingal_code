<!--
1) Start the HTML document with `<!DOCTYPE html>` and open `<html>`.

2) Inside the `<body>`:
   a) Add a heading `<h2>` with text: "JavaScript Functions".
   b) Add a paragraph describing the task:
      "Do a calculation and then display the result."
   c) Add an empty paragraph `<p id="demo"></p>` to show the output.

3) Add a `<script>` tag to write JavaScript.

4) Create a function named `add(a, b)`:
   a) Return the sum of `a + b`.

5) Create a function named `average(a, b)`:
   a) Call `add(a, b)` to get the sum.
   b) Divide the sum by `2` and return the average.

6) Call the `average()` function:
   a) Store the returned value in a variable named `result`.
   b) Example call: `average(10, 20)`.

7) Display the final result on the webpage:
   a) Use `document.getElementById("demo").innerHTML = result;`

8) Close all tags properly.
-->

<!DOCTYPE html>
<html>
   <body>
      <h2>JavaScript Functions</h2>
      <p>Do a calculation and then display the result.</p>
      <p id="demo"></p>

      <script>
         function add(a, b) {
            return a + b;
         }

         function average(a, b) {
            var sum = add(a, b);
            return sum / 2;
         }

         var result = average(10, 20);
         document.getElementById("demo").innerHTML = result;
      </script>
   </body>
</html>
