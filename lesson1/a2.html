<!--
1) Start the HTML document with `<!DOCTYPE html>` and set the language as English.

2) Inside the `<head>` section:
   a) Add character encoding using `<meta charset="UTF-8">`.
   b) Add the viewport meta tag for responsive design.
   c) Set the page title as "The Formatter's Lab".

3) Inside the `<body>` section, add the main heading and intro paragraph.
   a) Use `<h1>` for the page title.
   b) Use `<p>` to introduce the formatting lab.

4) Create the Bold vs Strong section.
   a) Use `<b>` to make text visually bold.
   b) Use `<strong>` to show important text with meaning.

5) Create the Italic vs Emphasis section.
   a) Use `<i>` for italic text, such as scientific names.
   b) Use `<em>` to show stressed or emphasized text.

6) Create the Highlight and Small section.
   a) Use `<mark>` to highlight key information.
   b) Use `<small>` for secondary or extra details.

7) Create the Deleted Text section.
   a) Use `<del>` to show removed or corrected information.

8) Create the Superscript and Subscript section.
   a) Use `<sup>` for powers like r² and c².
   b) Use `<sub>` for formulas like H₂O.

9) Close the `<body>` and `<html>` tags to complete the webpage.
-->
   <!DOCTYPE html>
   <html lang="en">
   <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>The Formatter's Lab</title>
   </head>
   <body>
      <h1>The Formatter's Lab</h1>
      <p>Welcome to the Formatter's Lab!</p>
      <b>Bold Text</b> 
      <strong>Strong Text</strong>
      <i>Favour, Merit, Charles.</i> 
      <em>Emphasized Text</em>
      <mark>Highlighted Text</mark>
      <small>Small Text</small>
      <del>Deleted Text</del>
      <p>r<sup>2</sup></p>
      <p>H<sub>2</sub>O</p>
   </body>
   </html>
